name: cinlink
description: CinLink tools exposed through the standalone CLI.
tools:
  - name: cinlink_configure
    command: cinlink --json onboarding --api-key "{api_key}"
    args_schema:
      api_key: string
      runtime_base: string
      billing_base: string
  - name: cinlink_doctor
    command: cinlink --json doctor
    args_schema: {}
  - name: cinlink_setup_local_deps
    command: cinlink --json setup-local-deps
    args_schema:
      yes: boolean
      dry_run: boolean
      skip_ffmpeg: boolean
      with_voice_separation: boolean
      skip_voice_separation: boolean
      with_enhancement: boolean
      skip_enhancement: boolean
  - name: cinlink_agent_run
    command: cinlink --json agent run "{prompt}"
    args_schema:
      prompt: string
      context_file: string[]
      context_descriptors: object[]
      client_request_id: string
      app_language: string
      hidden_context: string
      mode: string
      task_intent: string
      task_parameters: object
      conversation_state: object
      wait: boolean
      include_events: boolean
      timeout: number
  - name: cinlink_agent_clarify
    command: cinlink --json agent clarify "{run_id}"
    args_schema:
      run_id: string
      clarification_id: string
      value: string
      answer: string
      answers: object
      client_request_id: string
      wait: boolean
      include_events: boolean
      timeout: number
  - name: cinlink_agent_cancel
    command: cinlink --json agent cancel "{run_id}"
    args_schema:
      run_id: string
  - name: cinlink_agent_events
    command: cinlink --json agent events "{run_id}"
    args_schema:
      run_id: string
      last_event_id: string
      timeout: number
  - name: cinlink_transcribe
    command: cinlink --json transcribe "{input_path}"
    args_schema:
      input_path: string
      lang: string
      out: string
  - name: cinlink_translate
    command: cinlink --json translate "{input_path}" --to "{to_lang}"
    args_schema:
      input_path: string
      from_lang: string
      to_lang: string
      bilingual: boolean
      delivery: string
      out: string
  - name: cinlink_add_subtitles
    command: cinlink --json add-subtitles "{video_path}"
    args_schema:
      video_path: string
      subtitle_path: string
      source_lang: string
      target_lang: string
      bilingual: boolean
      out: string
      font_size: integer
      font_name: string
      font_color: string
      outline_color: string
      outline_width: number
      margin_v: integer
      position: string
      watermark_text: string
      watermark_image_path: string
      no_brand_kit: boolean
  - name: cinlink_dub
    command: cinlink --json dub "{video_path}" --subtitle "{subtitle_path}"
    args_schema:
      video_path: string
      subtitle_path: string
      reference_subtitle_path: string
      reference_audio_paths: object
      voice: string
      language: string
      out: string
  - name: cinlink_burn
    command: cinlink --json burn "{video_path}" --subtitle "{subtitle_path}"
    args_schema:
      video_path: string
      subtitle_path: string
      out: string
      font_size: integer
      font_name: string
      font_color: string
      outline_color: string
      outline_width: number
      margin_v: integer
      position: string
      watermark_text: string
      watermark_image_path: string
      no_brand_kit: boolean
  - name: cinlink_apply_watermark
    command: cinlink --json apply-watermark "{video_path}"
    args_schema:
      video_path: string
      out: string
      no_brand_kit: boolean
      watermark_text: string
      watermark_position: string
      watermark_font_size: integer
      watermark_color: string
      watermark_opacity: number
      watermark_margin: integer
      watermark_image_path: string
      watermark_image_position: string
      watermark_image_width: integer
      watermark_image_opacity: number
      watermark_image_margin: integer
  - name: cinlink_enhance_image
    command: cinlink --json enhance-image "{image_path}"
    args_schema:
      image_path: string
      out: string
      scale: integer
      noise_level: integer
      model: string
  - name: cinlink_enhance_video
    command: cinlink --json enhance-video "{video_path}"
    args_schema:
      video_path: string
      out: string
      scale: integer
      noise_level: integer
      model: string
  - name: cinlink_trim_video
    command: cinlink --json trim-video "{video_path}" --start "{start_sec}" --end "{end_sec}"
    args_schema:
      video_path: string
      start_sec: number
      end_sec: number
      out: string
  - name: cinlink_montage
    command: cinlink --json montage --clips-json "{clips}"
    args_schema:
      clips: object[]
      out: string
  - name: cinlink_clean_cut
    command: cinlink --json clean-cut "{video_path}"
    args_schema:
      video_path: string
      out: string
      minimum_silence_sec: number
      noise_threshold_db: number
      retained_pause_sec: number
      minimum_removal_sec: number
      plan_only: boolean
      selected_removal_indexes: integer[]
  - name: cinlink_brand_kit
    command: cinlink --json brand-kit "{action}"
    args_schema:
      action: string
      enabled: boolean
      font_size: integer
      font_name: string
      font_color: string
      outline_color: string
      outline_width: number
      margin_v: integer
      position: string
      watermark_text: string
      watermark_image_path: string
  - name: cinlink_mix_dubbed_audio
    command: cinlink --json mix-dubbed-audio "{video_path}" --dubbed-audio "{dubbed_audio_path}"
    args_schema:
      video_path: string
      dubbed_audio_path: string
      out: string
      original_volume: number
      dubbed_volume: number
  - name: cinlink_summarize
    command: cinlink --json summarize "{input_path}"
    args_schema:
      input_path: string
      max_highlights: integer
      out: string
  - name: cinlink_shorten
    command: cinlink --json shorten "{video_path}"
    args_schema:
      video_path: string
      max_clips: integer
      target_duration: integer
      style_preset: string
      music_mode: string
      music_prompt: string
      selection_instruction: string
      output_language: string
      out: string
  - name: cinlink_image
    command: cinlink --json image "{prompt}"
    args_schema:
      prompt: string
      aspect_ratio: string
      image_size: string
      reference_image_urls: string[]
      model: string
      timeout: number
      out: string
  - name: cinlink_video
    command: cinlink --json video "{prompt}"
    args_schema:
      prompt: string
      aspect_ratio: string
      resolution: string
      duration: integer
      generate_audio: boolean
      watermark: boolean
      generation_mode: string
      first_frame_image_url: string
      reference_image_urls: string[]
      reference_video_urls: string[]
      reference_audio_urls: string[]
      model: string
      model_name: string
      model_version: string
      out: string
  - name: cinlink_deconstruct_video
    command: cinlink --json deconstruct-video "{video_path}"
    args_schema:
      video_path: string
      replacement_references: object[]
      language: string
      analysis_scope: string
      scene_threshold: number
      max_shots: integer
      out: string
  - name: cinlink_regenerate_deconstruction
    command: cinlink --json regenerate-deconstruction "{plan_path}"
    args_schema:
      plan_path: string
      replacement_references: object[]
      resolution: string
      preserve_original_audio: boolean
      model: string
      model_name: string
      model_version: string
      timeout: number
      out: string
  - name: cinlink_export_video
    command: cinlink --json export-video "{video_path}"
    args_schema:
      video_path: string
      output_format: string
      out: string
  - name: cinlink_export_audio
    command: cinlink --json export-audio "{video_path}"
    args_schema:
      video_path: string
      audio_path: string
      output_format: string
      out: string
  - name: cinlink_export_editor_project
    command: cinlink --json export-editor-project "{video_path}" --target "{target}"
    args_schema:
      video_path: string
      target: string
      subtitle_path: string
      audio_path: string
      out: string
  - name: cinlink_nlu
    command: cinlink --json nlu "{prompt}"
    args_schema:
      prompt: string
      has_video: boolean
      has_subtitle: boolean
      pending_target_language: string
      context_files: string[]
  - name: cinlink_mcp
    command: cinlink-mcp
    transport: stdio
